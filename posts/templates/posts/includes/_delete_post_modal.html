{% comment %}
Модальное окно для подтверждения удаления поста.
Переиспользуется в home.html и detail.html.
{% endcomment %}
<div class="modal fade" id="deletePostModal" tabindex="-1" aria-labelledby="deletePostModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="deletePostModalLabel">
                    <i class="bi bi-exclamation-triangle"></i> Подтверждение удаления
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Вы уверены, что хотите удалить этот пост?</p>
                <div class="alert alert-light" id="deletePostPreview">
                    <p class="mb-0"><strong id="deletePostText">{{ post_text }}</strong></p>
                </div>
                <p class="text-muted small">Это действие нельзя отменить.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-x"></i> Отмена
                </button>
                <form method="post" id="deletePostForm" action="{{ delete_url }}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Да, удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
