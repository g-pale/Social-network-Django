{% comment %}
Общий шаблон аватара пользователя с fallback на первую букву имени.
Использование: {% include 'includes/_avatar.html' with user=some_user size=40 font_size=18 %}
{% endcomment %}
{% if user.avatar %}
<img src="{{ user.avatar.url }}" alt="{{ user.username }}" class="rounded-circle me-2"
    style="width: {{ size }}px; height: {{ size }}px; object-fit: cover;">
{% else %}
<div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center me-2"
    style="width: {{ size }}px; height: {{ size }}px; font-size: {{ font_size }}px;">
    {{ user.username|first|upper }}
</div>
{% endif %}
