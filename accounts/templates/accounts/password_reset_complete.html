{% extends 'base.html' %}

{% block title %}Пароль изменен - MiniSocial{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <i class="bi bi-check-circle display-1 text-success"></i>
                </div>
                
                <h2 class="card-title mb-4">Пароль успешно изменен</h2>
                
                <p class="text-muted mb-4">
                    Ваш пароль был успешно изменен. Теперь вы можете войти в систему с новым паролем.
                </p>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
